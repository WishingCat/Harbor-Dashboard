<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('harbor-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111916' : '#f6f7f7';
      })();
    </script>
    <meta name="description" content="Harbor 任务、运行产物与协作评审工作台" />
    <title>Harbor Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
