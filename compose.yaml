services:
  harbor-dashboard:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ${HARBOR_ENV_FILE:-./deploy/runtime.env}
    environment:
      HARBOR_DATA_DIR: /app/data
      HARBOR_BOOTSTRAP_DIR: /app/deploy/bootstrap
    volumes:
      - harbor-data:/app/data
    restart: unless-stopped

volumes:
  harbor-data:
